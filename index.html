<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111">
<title>TOURING AUTO v3</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f2f3f5;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
main{max-width:640px;margin:auto;padding:14px}
.card{background:#fff;border-radius:18px;padding:18px;margin:10px 0;box-shadow:0 2px 12px #0001}
h1{font-size:25px;margin:0 0 4px}.muted{color:#666;font-size:13px;line-height:1.5}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-weight:700;margin:14px 0 6px}
input,select,button{width:100%;font-size:17px;padding:13px;border-radius:12px;border:1px solid #ccc;background:#fff}
button.main{background:#111;color:#fff;border:0;font-weight:700;margin-top:16px}
button:disabled{opacity:.55}
.dirs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.dirs button{font-size:15px;padding:11px}.dirs .on{background:#111;color:#fff}
#msg{margin-top:12px;font-size:14px;line-height:1.5}
.candidate{border-top:1px solid #eee;padding:14px 0}.candidate:first-child{border-top:0}
.big{font-size:25px;font-weight:800}
.badge{display:inline-block;font-size:12px;padding:4px 8px;border-radius:99px;background:#eee;margin:6px 4px 0 0}
.open{display:block;background:#1877f2;color:#fff;text-align:center;text-decoration:none;padding:13px;border-radius:12px;font-weight:700;margin-top:10px}
.detail{font-size:13px;line-height:1.6;margin-top:8px}
.warn{font-size:12px;color:#777;line-height:1.55}
.hide{display:none}
.smallbtn{font-size:14px;padding:9px;margin-top:8px}
</style>
</head>
<body>
<main>
<div class="card">
<h1>🏍️ TOURING AUTO</h1>
<div class="muted">距離・方角・走り方から、実走道路に沿った周回コース候補を自動作成</div>

<label>出発地</label>
<input id="start" value="新潟市西区" autocomplete="street-address">

<div class="row">
<div><label>目標距離</label>
<select id="km">
<option>100</option><option>150</option><option>200</option><option selected>300</option>
<option>350</option><option>400</option><option>450</option>
</select></div>
<div><label>走り方</label>
<select id="style">
<option value="normal">標準</option>
<option value="twisty">峠・山道優先</option>
<option value="scenic">景色優先</option>
</select></div>
</div>

<label>方角</label>
<div class="dirs" id="dirs">
<button data-d="315">↖ 北西</button><button data-d="0">↑ 北</button><button data-d="45" class="on">↗ 北東</button>
<button data-d="270">← 西</button><button data-d="null">◎ おまかせ</button><button data-d="90">→ 東</button>
<button data-d="225">↙ 南西</button><button data-d="180">↓ 南</button><button data-d="135">↘ 南東</button>
</div>

<button class="main" id="go">🚀 コースを自動作成</button>
<div id="msg"></div>
</div>

<div class="card hide" id="out">
<h2>候補コース</h2>
<div class="muted">目標距離に近い順。各候補は道路距離を再計算しています。</div>
<div id="list"></div>
<p class="warn">※Googleマップを開くと、Google側の道路条件により距離・経路が多少変わることがあります。実走前に通行止め・冬季閉鎖・二輪規制を確認してください。</p>
</div>

<div class="card">
<div class="warn"><b>v3の改良点</b><br>
候補地点を増やして周回形状を変えながら道路距離を反復計算し、目標距離に近い候補を探します。走り方に応じて候補形状と高速道路回避を切り替えます。
</div>
</div>
</main>

<script>
let bearing=45;
document.querySelectorAll('#dirs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#dirs button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  bearing=b.dataset.d==='null'?null:+b.dataset.d;
});

const enc=x=>encodeURIComponent(x);

async function geocode(q){
  const u='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=jp&q='+enc(q);
  const r=await fetch(u,{headers:{Accept:'application/json'}});
  if(!r.ok) throw Error('出発地検索エラー');
  const a=await r.json();
  if(!a[0]) throw Error('出発地が見つかりません');
  return [+a[0].lon,+a[0].lat];
}

function dest(lat,lon,km,deg){
  const R=6371,d=km/R,a=deg*Math.PI/180,p=lat*Math.PI/180,l=lon*Math.PI/180;
  const q=Math.asin(Math.sin(p)*Math.cos(d)+Math.cos(p)*Math.sin(d)*Math.cos(a));
  const l2=l+Math.atan2(Math.sin(a)*Math.sin(d)*Math.cos(p),Math.cos(d)-Math.sin(p)*Math.sin(q));
  return [l2*180/Math.PI,q*180/Math.PI];
}

async function route(points, style){
  let u='https://router.project-osrm.org/route/v1/driving/'+points.map(p=>p.join(',')).join(';')+
        '?overview=false&steps=false&alternatives=false';
  if(style==='twisty') u+='&exclude=motorway';
  const r=await fetch(u);
  if(!r.ok) throw Error('道路ルート計算エラー');
  return r.json();
}

function gmap(points){
  const origin=points[0][1]+','+points[0][0];
  const mids=points.slice(1,-1).map(p=>p[1]+','+p[0]).join('|');
  return 'https://www.google.com/maps/dir/?api=1&origin='+enc(origin)+
    '&destination='+enc(origin)+'&travelmode=driving&waypoints='+enc(mids);
}

function angleDiff(a,b){
  let d=Math.abs(a-b)%360; return d>180?360-d:d;
}

function patterns(base,style){
  if(base===null){
    base=[0,45,90,135,180,225,270,315][Math.floor(Math.random()*8)];
  }
  const side=style==='twisty'?55:style==='scenic'?70:60;
  const far=style==='twisty'?28:style==='scenic'?38:32;
  return [
    [base,base+side,base-side],
    [base,base+far,base-side],
    [base,base+side,base-far],
    [base,base+45,base-75],
    [base,base+75,base-45],
    [base,base+90,base-60]
  ].map(x=>x.map(a=>(a+360)%360));
}

async function makeCandidate(lon,lat,target,base,style,scale,pat){
  // 3 waypoints create a real loop. Radii are fractions of target; OSRM road distance is measured.
  const radii=style==='scenic'?[.30,.42,.30]:style==='twisty'?[.32,.46,.34]:[.32,.44,.32];
  const pts=[[lon,lat]];
  for(let i=0;i<3;i++) pts.push(dest(lat,lon,target*scale*radii[i],pat[i]));
  pts.push([lon,lat]);
  const d=await route(pts,style);
  if(d.code!=='Ok'||!d.routes?.[0]) return null;
  return {km:d.routes[0].distance/1000,pts,base,pat,scale};
}

document.getElementById('go').onclick=async()=>{
  const msg=document.getElementById('msg'),out=document.getElementById('out'),list=document.getElementById('list');
  const btn=document.getElementById('go');
  out.classList.add('hide'); list.innerHTML=''; btn.disabled=true;
  try{
    const [lon,lat]=await geocode(document.getElementById('start').value);
    const target=+document.getElementById('km').value;
    const style=document.getElementById('style').value;
    let base=bearing;
    if(base===null) base=[0,45,90,135,180,225,270,315][Math.floor(Math.random()*8)];

    msg.textContent='道路ルートを計算中…（目標距離に近づけています）';
    const pats=patterns(base,style);
    const scales=[.82,.88,.94,1.00,1.06,1.12,1.18,1.25,1.32];
    const all=[];
    // Multiple shapes and scales. First pass can stop early when very close.
    outer:
    for(const pat of pats){
      for(const scale of scales){
        try{
          const c=await makeCandidate(lon,lat,target,base,style,scale,pat);
          if(c) all.push(c);
          if(all.some(x=>Math.abs(x.km-target)<=3)) break outer;
        }catch(e){}
      }
    }
    if(!all.length) throw Error('道路ルートが見つかりません');
    all.sort((a,b)=>Math.abs(a.km-target)-Math.abs(b.km-target));

    const unique=[];
    for(const c of all){
      if(!unique.some(x=>Math.abs(x.km-c.km)<5 && JSON.stringify(x.pat)===JSON.stringify(c.pat))) unique.push(c);
      if(unique.length>=3) break;
    }

    list.innerHTML=unique.map((c,i)=>{
      const err=Math.abs(c.km-target);
      const dirName=['北','北東','東','南東','南','南西','西','北西'][Math.round((c.base%360)/45)%8];
      return `<div class="candidate">
        <div class="big">候補${i+1}　${c.km.toFixed(1)} km</div>
        <div class="muted">目標との差 ${err.toFixed(1)} km</div>
        <span class="badge">方角 ${dirName}</span>
        <span class="badge">${style==='twisty'?'高速回避・山道寄り':style==='scenic'?'景色寄り':'標準'}</span>
        <div class="detail">周回経由地：3地点 → Googleマップへ引き継ぎ</div>
        <a class="open" target="_blank" rel="noopener" href="${gmap(c.pts)}">🗺️ Googleマップで開く</a>
      </div>`;
    }).join('');

    out.classList.remove('hide');
    msg.textContent='完成しました。道路距離を計算し、目標に近い候補を表示しました。';
  }catch(e){
    msg.textContent='作成できませんでした：'+e.message+'。通信環境または出発地を確認してください。';
  }finally{
    btn.disabled=false;
  }
};
</script>
</body>
</html>
