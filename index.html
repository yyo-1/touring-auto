<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111"><title>TOURING AUTO v17</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f2f3f5;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}main{max-width:680px;margin:auto;padding:16px}.card{background:#fff;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 2px 10px #0001}h1{font-size:25px;margin:0 0 5px}.muted{color:#666;font-size:13px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;font-weight:700;margin:12px 0 5px}input,select,button{width:100%;font-size:16px;padding:12px;border-radius:12px;border:1px solid #ccc;background:#fff}button{cursor:pointer}button.main{background:#111;color:#fff;border:0;font-weight:800;margin-top:15px}button:disabled{opacity:.5}.dirs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.dirs button{font-size:14px;padding:10px 4px}.dirs button.sel{background:#111;color:#fff}.msg{margin-top:12px;line-height:1.5}.candidate{border-top:1px solid #eee;padding:18px 0 4px}.big{font-size:27px;font-weight:850}.badge{display:inline-block;background:#eee;border-radius:20px;padding:6px 10px;margin:7px 5px 5px 0;font-size:13px}.open{display:block;background:#1877f2;color:#fff;text-decoration:none;text-align:center;font-weight:800;padding:14px;border-radius:13px;margin-top:10px}.detail{font-size:13px;color:#555;line-height:1.6}.warn{font-size:12px;color:#555;line-height:1.6}.version{display:inline-block;background:#111;color:#fff;border-radius:20px;padding:4px 9px;font-size:12px;margin-left:5px}</style></head><body><main>
<div class="card"><h1>🏍️ TOURING AUTO <span class="version">v16</span></h1><div class="muted">実道路距離・方角・フェリー除外・Google Maps iPhone対応</div>
<label>出発地</label><input id="start" value="新潟市西区 五十嵐2の町"><div class="row"><div><label>目標距離</label><select id="dist"><option>100</option><option>150</option><option>200</option><option selected>300</option><option>350</option><option>400</option><option>450</option></select></div><div><label>走り方</label><select id="style"><option value="normal">標準</option><option value="twisty">峠・山道優先</option><option value="scenic">景色優先</option></select></div></div><label>方向</label><div class="dirs" id="dirs"></div><button class="main" id="go">🚀 コースを自動作成</button><div id="msg" class="msg"></div></div><div class="card" id="results" style="display:none"></div>
<div class="card warn"><b>v17の考え方</b><br>① 目標距離を実道路距離で調整<br>② 方角に沿う候補だけを採用<br>③ 経由地点を道路へスナップ<br>④ フェリーを含むルートを自動除外<br>⑤ Google Mapsは3経由地を一括送信せず、4区間に分割<br>⑥ 各区間は出発地・到着地の2地点だけを渡します<br>※Google Maps側の交通状況・道路規制により距離は変動します。</div></main>
<script>
const directions=[["北",0],["北東",45],["東",90],["南東",135],["南",180],["南西",225],["西",270],["北西",315],["おまかせ",null]];let selected=45;const dirs=document.getElementById('dirs');directions.forEach(([name,b])=>{const x=document.createElement('button');x.textContent=name;if(name==='北東')x.className='sel';x.onclick=()=>{[...dirs.children].forEach(y=>y.classList.remove('sel'));x.classList.add('sel');selected=b};dirs.appendChild(x)});
const rad=x=>x*Math.PI/180,deg=x=>x*180/Math.PI,norm=x=>(x+360)%360;
function dest(lat,lon,km,b){const R=6371,d=km/R,br=rad(b),p=rad(lat),l=rad(lon),p2=Math.asin(Math.sin(p)*Math.cos(d)+Math.cos(p)*Math.sin(d)*Math.cos(br)),l2=l+Math.atan2(Math.sin(br)*Math.sin(d)*Math.cos(p),Math.cos(d)-Math.sin(p)*Math.sin(p2));return [deg(l2),deg(p2)]}
function hav(a,b){const R=6371,p1=rad(a[1]),p2=rad(b[1]),dp=rad(b[1]-a[1]),dl=rad(b[0]-a[0]);const h=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
async function geocode(q){const u='https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=jp&q='+encodeURIComponent(q);const r=await fetch(u,{headers:{'Accept-Language':'ja'}});if(!r.ok)throw Error('出発地の検索に失敗しました');const a=await r.json();if(!a.length)throw Error('出発地が見つかりません');return [Number(a[0].lat),Number(a[0].lon)]}
async function route(points,twisty){const c=points.map(p=>p.join(',')).join(';');let u='https://router.project-osrm.org/route/v1/driving/'+c+'?overview=false&steps=true&alternatives=false';let ex=[];if(twisty)ex.push('motorway');if(ex.length)u+='&exclude='+ex.join(',');const r=await fetch(u);const txt=await r.text();if(!r.ok)throw Error('道路ルート計算に失敗しました');const j=JSON.parse(txt);if(j.code!=='Ok'||!j.routes?.length)throw Error('道路ルートが見つかりません');const steps=(j.routes[0].legs||[]).flatMap(x=>x.steps||[]);const ferryStep=steps.some(s=>{const m=String(s.mode||'').toLowerCase();const n=String(s.name||'').toLowerCase();const r=String(s.ref||'').toLowerCase();return m==='ferry'||/ferry|フェリー|渡船/.test(m+' '+n+' '+r)});if(ferryStep)throw Error('フェリーを含むルートを除外');const snapped=(j.waypoints||[]).map(w=>w.location);if(snapped.length!==points.length)throw Error('道路上の地点を取得できません');for(let i=0;i<points.length;i++){if(hav(points[i],snapped[i])>(i===0||i===points.length-1?1.5:3))throw Error('道路から離れた地点を除外')}return {km:j.routes[0].distance/1000,snapped}}
function signOK(origin,p,b){const dx=p[0]-origin[0],dy=p[1]-origin[1];const ang=norm(deg(Math.atan2(dx,dy)));let d=Math.abs(((ang-b+540)%360)-180);return d<=58}
function pattern(base,i){const sets=[[-28,8,40],[-18,15,48],[-35,20,55],[-12,28,62],[-42,5,52],[-25,32,70]];return sets[i%sets.length].map(x=>norm(base+x))}
function makeCandidate(lat,lon,target,base,style,i,scale){const rr=style==='scenic'?[.20,.28,.20]:style==='twisty'?[.18,.26,.19]:[.19,.27,.19];const bs=pattern(base,i),p=[[lon,lat]];for(let k=0;k<3;k++){const q=dest(lat,lon,target*scale*rr[k],bs[k]);if(!signOK([lon,lat],q,base))return null;p.push(q)}p.push([lon,lat]);return {p}}
async function optimize(lat,lon,target,base,style,i){let lo=.55,hi=1.7,best=null;for(let n=0;n<7;n++){const scale=(lo+hi)/2,c=makeCandidate(lat,lon,target,base,style,i,scale);if(!c){lo=scale;continue}try{const rr=await route(c.p,style==='twisty');c.km=rr.km;c.p=rr.snapped;if(!best||Math.abs(c.km-target)<Math.abs(best.km-target))best=c;if(c.km<target)lo=scale;else hi=scale}catch(e){hi=scale}}return best}
function segUrl(a,b){const f=p=>p[1].toFixed(6)+','+p[0].toFixed(6);return 'https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(f(a))+'&destination='+encodeURIComponent(f(b))+'&travelmode=driving&dir_action=navigate'}
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function build(){const msg=document.getElementById('msg'),res=document.getElementById('results'),target=Number(document.getElementById('dist').value),style=document.getElementById('style').value;msg.textContent='道路ルートを計算中…';res.style.display='none';try{const [lat,lon]=await geocode(document.getElementById('start').value);let base=selected;if(base===null)base=Math.floor(Math.random()*8)*45;const arr=[];for(let i=0;i<12;i++){const c=await optimize(lat,lon,target,base,style,i);if(c)arr.push(c)}if(!arr.length)throw Error('フェリーを使わない道路ルートを作れませんでした。方向を変えて再試行してください。');arr.sort((a,b)=>Math.abs(a.km-target)-Math.abs(b.km-target));res.innerHTML=arr.slice(0,3).map((c,i)=>{let buttons='';for(let s=0;s<4;s++)buttons+='<a class="open" href="'+segUrl(c.p[s],c.p[s+1])+'" target="_blank">🗺️ '+(s+1)+'区間目をGoogle Mapsで開く</a>';return '<div class="candidate"><div class="big">候補'+(i+1)+'　約'+c.km.toFixed(1)+' km</div><div>目標との差　約'+Math.abs(c.km-target).toFixed(1)+' km</div><span class="badge">方角 '+(selected===null?'おまかせ':directions.find(x=>x[1]===selected)[0])+'</span><span class="badge">'+(style==='normal'?'標準':style==='twisty'?'峠・山道優先':'景色優先')+'</span><div class="detail">フェリーなし・Google Maps iPhone対策：4区間</div>'+buttons+'</div>'}).join('');res.style.display='block';msg.textContent='✅ 完成しました。フェリーを除外した道路ルートです。'}catch(e){msg.textContent='⚠️ '+e.message}}
document.getElementById('go').onclick=build;
</script></body></html>
