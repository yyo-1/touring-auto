<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TOURING AUTO v35</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f3f5;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;color:#111}main{max-width:680px;margin:auto;padding:16px}.card{background:#fff;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 2px 10px #0001}h1{margin:0 0 5px;font-size:25px}.muted,.detail,.warn{color:#666;font-size:13px;line-height:1.6}label{display:block;font-weight:700;margin:12px 0 5px}input,select,button{width:100%;font-size:16px;padding:12px;border-radius:12px;border:1px solid #ccc;background:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.dirs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.dirs button{font-size:14px;padding:10px 4px}.sel,.main{background:#111!important;color:#fff!important}.main{border:0;font-weight:800;margin-top:15px}.msg{margin-top:12px;line-height:1.5}.candidate{border-top:1px solid #eee;padding:18px 0 4px}.big{font-size:27px;font-weight:850}.badge{display:inline-block;background:#eee;border-radius:20px;padding:6px 10px;margin:7px 5px 5px 0;font-size:13px}.open{display:block;background:#1877f2;color:#fff;text-decoration:none;text-align:center;font-weight:800;padding:14px;border-radius:13px;margin-top:10px}.version{display:inline-block;background:#111;color:#fff;border-radius:20px;padding:4px 9px;font-size:12px}
</style></head><body><main>
<div class="card"><h1>🏍️ TOURING AUTO <span class="version">v35</span></h1><div class="muted">実道路距離・方角・Google Maps iPhone対応</div>
<label>出発地</label><input id="start" value="新潟市西区 五十嵐2の町">
<div class="row"><div><label>目標距離</label><select id="dist"><option>100</option><option>150</option><option>200</option><option selected>300</option><option>350</option><option>400</option><option>450</option></select></div><div><label>走り方</label><select id="style"><option value="normal">標準</option><option value="twisty">峠・山道優先</option><option value="scenic">景色優先</option></select></div></div>
<label style="display:flex;align-items:center;gap:8px"><input id="avoid" type="checkbox" style="width:20px;height:20px"> 往復で同じ道をできるだけ使わない</label>
<label>方向</label><div class="dirs" id="dirs"></div><button class="main" id="go" onclick="build()">🚀 コースを自動作成</button><div id="msg" class="msg"></div></div>
<div class="card" id="results" style="display:none"></div>
<div class="card warn"><b>v35の変更点</b><br>Google Mapsのナビ開始指定を外し、出発→経由3点→出発の全体ルート表示を優先します。OSRMで実道路距離を計算し、目標距離に近い候補を表示します。</div>
</main><script>
const D=[["北",0],["北東",45],["東",90],["南東",135],["南",180],["南西",225],["西",270],["北西",315],["おまかせ",null]];let selected=45;
const box=document.getElementById("dirs");D.forEach(([n,b])=>{let x=document.createElement("button");x.textContent=n;if(n=="北東")x.className="sel";x.onclick=()=>{[...box.children].forEach(y=>y.classList.remove("sel"));x.classList.add("sel");selected=b};box.appendChild(x)});
const R=6371,rad=x=>x*Math.PI/180,deg=x=>x*180/Math.PI,norm=x=>(x+360)%360;
function dest(lat,lon,km,b){let d=km/R,p=rad(lat),l=rad(lon),br=rad(b),p2=Math.asin(Math.sin(p)*Math.cos(d)+Math.cos(p)*Math.sin(d)*Math.cos(br)),l2=l+Math.atan2(Math.sin(br)*Math.sin(d)*Math.cos(p),Math.cos(d)-Math.sin(p)*Math.sin(p2));return[deg(l2),deg(p2)]}
async function geo(q){let r=await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=jp&q="+encodeURIComponent(q),{headers:{"Accept-Language":"ja"}}),a=await r.json();if(!a.length)throw Error("出発地が見つかりません");return[+a[0].lat,+a[0].lon]}
async function near(p){let r=await fetch("https://router.project-osrm.org/nearest/v1/driving/"+p.join(",")+"?number=1"),j=await r.json(),w=j.waypoints?.[0];if(j.code!="Ok"||!w)throw Error("道路地点なし");if(+w.distance>8000)throw Error("道路から遠すぎます");return w.location}
async function route(p){let s=await Promise.all(p.map(near)),c=s.map(x=>x.join(",")).join(";"),r=await fetch("https://router.project-osrm.org/route/v1/driving/"+c+"?overview=false&steps=true&alternatives=false"),j=await r.json();if(j.code!="Ok"||!j.routes?.length)throw Error("道路ルートなし");let q=j.routes[0],f=(q.legs||[]).flatMap(x=>x.steps||[]);if(f.some(x=>/ferry|フェリー|渡船/i.test(String(x.name||"")+" "+String(x.ref||""))))throw Error("フェリー");return{km:q.distance/1000,p:s}}
function points(lat,lon,t,b,i,scale,avoid){let pat=avoid?[[-15,10,30],[-5,20,45],[-25,0,25],[-35,15,45],[10,-5,25],[20,0,35]]:[[-20,18,52],[-8,30,65],[-30,12,60],[-40,25,72],[18,-18,48],[28,-8,62]],a=pat[i%pat.length],base=b==null?0:b,ang=a.map(x=>norm(base+x)),rr=[.19,.28,.20];return[[lon,lat],dest(lat,lon,t*scale*rr[0],ang[0]),dest(lat,lon,t*scale*rr[1],ang[1]),dest(lat,lon,t*scale*rr[2],ang[2]),[lon,lat]]}
async function one(lat,lon,t,b,i,avoid){let best=null;for(let s of (avoid?[.65,.9,1.15,1.4]:[.75,1,1.25]))for(let k=0;k<5;k++){try{let p=points(lat,lon,t,b,i,s,avoid),r=await route(p),e=Math.abs(r.km-t);if(!best||e<best.e)best={e,km:r.km,p:r.p};s=Math.max(.3,Math.min(2,s*t/r.km))}catch(e){}}return best}
function maps(p){let f=x=>x[1].toFixed(6)+","+x[0].toFixed(6),u="https://www.google.com/maps/dir/?api=1&origin="+encodeURIComponent(f(p[0]))+"&destination="+encodeURIComponent(f(p[p.length-1]))+"&travelmode=driving";return u+"&waypoints="+encodeURIComponent(p.slice(1,-1).map(f).join("|"))}
async function build(){let btn=document.getElementById("go"),msg=document.getElementById("msg"),res=document.getElementById("results"),t=+dist.value,avoid=document.getElementById("avoid").checked;btn.disabled=true;btn.textContent="⏳ コース作成中…";msg.textContent="道路ルートを計算中…";res.style.display="none";try{let [lat,lon]=await geo(start.value),b=selected,jobs=Array.from({length:10},(_,i)=>one(lat,lon,t,b,i,avoid)),a=(await Promise.all(jobs)).filter(Boolean).sort((x,y)=>x.e-y.e);if(!a.length)throw Error("道路ルートを作れませんでした");res.innerHTML=a.slice(0,3).map((x,i)=>'<div class="candidate"><div class="big">候補'+(i+1)+'　約'+x.km.toFixed(1)+' km</div><div>目標との差　約'+x.e.toFixed(1)+' km</div><span class="badge">方角 '+(D.find(x=>x[1]===selected)?.[0]||"おまかせ")+'</span><div class="detail">実道路距離・Google Maps対応'+(avoid?"・往復同一路をできるだけ回避":"")+'</div><a class="open" href="'+maps(x.p)+'" target="_blank">🗺️ コース全体をGoogle Mapsで開く</a></div>').join("");res.style.display="block";msg.textContent="✅ 完成しました。全体ルート表示で開けます"}catch(e){msg.textContent="⚠️ "+e.message}finally{btn.disabled=false;btn.textContent="🚀 コースを自動作成"}}
</script></body></html>
